name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ADR-001 조건 2-a — 타르볼 무결성 검증.
      # SheetJS는 npm이 아니라 cdn.sheetjs.com 타르볼에서 온다. npm 레지스트리와 달리
      # 불변성 보장이 없으므로, package-lock의 integrity 해시와 실제 내려받은 타르볼이
      # 다르면 여기서 빌드가 깨져야 한다.
      #
      # `npm ci`여야 한다 — `npm install`은 해시가 어긋나면 lock을 조용히 고쳐 쓴다.
      - name: Install (integrity-verified)
        run: npm ci

      # lock이 손대지지 않았는지 확인. npm ci는 lock을 수정하지 않으므로
      # diff가 생겼다면 무결성 대조를 우회한 것이다.
      - name: Assert lockfile untouched
        run: git diff --exit-code package-lock.json

      - name: Typecheck
        run: npm run typecheck

      # ★ 화면 단언 33건을 깨운다 (감사 B-2) ★
      #
      # `tests/dev-db.ts`가 `.tmp/pnl.sqlite`를 스냅샷으로 떠서 워커에 넘긴다.
      # 그 파일이 없으면 화면 테스트가 통째로 `describe.skip`이 되고, CI는 **초록인 채로**
      # LOCK 10 화면 집행 · 손익 3층 항등식 · 「화면 숫자 = CLI 숫자」를 하나도 안 본다.
      # 6일간 그렇게 잤다. 하드웨어 문제가 아니라 이 한 줄이 없어서였다.
      #
      # `--clean`이어야 한다 — `fixtures/raw/`는 실명이 들어 커밋되지 않는다(헌장 E-10).
      # 기본값은 raw라서 이 플래그를 빼면 CI에서 파일을 못 찾는다.
      #
      # 이 시험들은 **절대값이 아니라 불변식**을 건다(`목록 행 수 = 적재 행 수` 같은 것).
      # 그래서 CI가 만든 DB와 실기기 DB가 내용이 달라도 같은 답을 낸다.
      - name: Seed dev DB (wakes screen assertions)
        run: npx tsx tools/harness/pnl.ts --clean

      - name: Test
        run: npm test

      # ★ 빌드 실패를 배포에서 처음 만나지 않는다 (감사 B-7) ★
      #
      # `typecheck`는 `tsc --noEmit`이라 **번들러가 죽는 자리를 못 본다** — import 경로,
      # 자산 해석, `vite.config.ts`의 플러그인은 여기서만 깨진다. 지금까지 CI에 이 줄이
      # 없어서 빌드 실패의 첫 발견자가 **베셀 프로덕션 배포**였다.
      #
      # `prebuild`가 `demo-db`를 돌리므로 이 한 줄이 데모 DB 생성까지 함께 확인한다.
      #
      # ※ 배선(`npm run wiring`)은 여기 안 건다 — 판정자는 `tests/wiring-coverage.test.ts`의
      #   `TODO_MAX = 0`이고 그건 위 `npm test`가 이미 돌린다. 같은 규칙을 두 군데서
      #   재면 한쪽이 낡는다 (CLI에는 손으로 부를 때를 위해 `--check`가 있다).
      - name: Build
        run: npm run build
