<!--
  앱 아이콘 원본 — 사이드바에 쓰는 FlowBase 마크 그대로다.

  목업의 인라인 SVG(Template.tsx의 사이드바 머리)를 독립 파일로 옮긴 것이고,
  좌표·그라디언트·굵기를 하나도 바꾸지 않았다. 화면 안의 로고와 창 아이콘이
  같은 그림이어야 같은 앱으로 보인다.

  JSX가 camelCase로 쓰던 속성(stopColor·strokeWidth·clipPath…)만 SVG 본래의
  kebab-case로 되돌렸다. 이건 표기 차이지 그림의 차이가 아니다.

  `npx tauri icon src-tauri/app-icon.svg`가 이 파일에서 플랫폼별 아이콘을 굽는다.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="1024" height="1024">
  <defs>
    <linearGradient id="fbMetal" gradientUnits="userSpaceOnUse" x1="2" y1="2" x2="30" y2="30">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#C8D0DA" />
      <stop offset="42%" stop-color="#767F8C" />
      <stop offset="56%" stop-color="#AEB8C4" />
      <stop offset="76%" stop-color="#EDF1F5" />
      <stop offset="100%" stop-color="#6B7481" />
    </linearGradient>
    <linearGradient id="fbTile" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#303338" />
      <stop offset="100%" stop-color="#141618" />
    </linearGradient>
    <clipPath id="fbClip">
      <circle cx="16" cy="16" r="10.6" />
    </clipPath>
  </defs>

  <rect x="0" y="0" width="32" height="32" rx="8.4" fill="url(#fbTile)" />
  <rect x="0.4" y="0.4" width="31.2" height="31.2" rx="8" fill="none"
        stroke="rgba(255,255,255,0.09)" stroke-width="0.8" />

  <g transform="translate(4.8 4.8) scale(0.7)" stroke="url(#fbMetal)" fill="none"
     stroke-linecap="round" stroke-linejoin="round">
    <g clip-path="url(#fbClip)">
      <path d="M0 9.5 c 5.44 -3, 10.56 -3, 16 0 s 10.56 3, 16 0" stroke-width="4.5" />
      <path d="M0 16 c 5.44 -3, 10.56 -3, 16 0 s 10.56 3, 16 0" stroke-width="4.5" />
      <path d="M0 22.5 c 5.44 -3, 10.56 -3, 16 0 s 10.56 3, 16 0" stroke-width="4.5" />
    </g>
    <circle cx="16" cy="16" r="13" stroke-width="2.7" fill="none" />
  </g>
</svg>
